[project]
name = "multivac-llm"
version = "0.1.0"
description = "Semillero Aperture: construir un modelo de lenguaje tipo GPT desde cero"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "torch>=2.8",
    "numpy",
    "matplotlib",
    "graphviz",
    "tiktoken",
    "transformers",
    "datasets",
    "tqdm",
    "regex>=2026.9.10",
]

[dependency-groups]
dev = [
    "jupyterlab",
    "ipykernel",
    "ipywidgets",
]

# PyTorch con CUDA en Windows/Linux; en macOS se usa la versión normal de PyPI.
[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
